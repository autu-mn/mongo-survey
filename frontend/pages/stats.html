<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>统计 - 问卷系统</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main>
  <div id="msg"></div>
  <div id="app"></div>
</main>
<script src="/static/api.js"></script>
<script>
  requireLogin();
  renderNav();
  const id = pathParam(1);
  const msg = document.getElementById("msg");
  let allQuestions = [];
  let sourceByQuestion = {}; // 【第二阶段新增】从单卷统计跳到对应题目的同版统计

  async function exportCsv() {
    // 导出接口需要登录凭证，不能直接用链接下载，先取回文件再触发保存
    const res = await fetch(`/api/surveys/${id}/export.csv`, { headers: { Authorization: "Bearer " + Auth.token() } });
    if (!res.ok) { flash(msg, errorBanner(await res.json()), 0); return; }
    const name = decodeURIComponent((res.headers.get("Content-Disposition") || "").split("''")[1] || "export.csv");
    const url = URL.createObjectURL(await res.blob());
    h("a", { href: url, download: name }).click();
    URL.revokeObjectURL(url);
  }

  const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const pct = (r) => `${(r * 100).toFixed(1)}%`;

  function choiceTable(q) {
    const unit = q.type === "single" ? "人" : "次";
    return h("table", { class: "stat-table" }, h("tbody", {}, q.options.map((o, i) => h("tr", {},
      h("td", { style: "width:34%" },
        h("span", { class: "option-letter" }, LETTERS[i]), o.text,
        o.hidden ? h("span", { class: "badge hidden", style: "margin-left:8px" }, "已删除") : null),
      h("td", {}, h("div", { class: "bar-wrap" }, h("div", { class: "bar", style: `width:${pct(o.ratio)}` }))),
      h("td", { class: "num", style: "white-space:nowrap;width:5em" }, `${o.count} ${unit}`),
      h("td", { class: "num muted", style: "white-space:nowrap;width:5em" }, pct(o.ratio)),
    ))));
  }

  function questionStat(q) {
    const skippedNote = q.skippedCount ? `，${q.skippedCount} 人未作答（被跳过或选填未答）` : "";
    return h("div", { class: "card question-card" + (q.hidden ? " is-hidden" : "") },
      h("div", { class: "head" },
        h("span", { class: "qno" }, q.order), h("h3", { style: "margin:0;font-size:var(--fs-2)" }, q.title),
        h("span", { class: "tag", style: "margin:0" }, TYPE_TEXT[q.type]),
        q.hidden ? h("span", { class: "badge hidden" }, "已删除") : null),
      h("p", { class: "muted" }, `${q.answeredCount} 人作答${skippedNote}`),
      sourceByQuestion[q.questionId]?.sourceItemId ? h("p", {},
        h("a", { href: `/questions/${sourceByQuestion[q.questionId].sourceItemId}` }, "查看题目版本与同版跨卷统计")) : null,
      q.options ? choiceTable(q) : null,
      q.type === "number" ? (q.average === null ? h("p", { class: "muted" }, "还没有人作答。") :
        h("div", { class: "figures" },
          h("div", {}, h("b", {}, Number(q.average.toFixed(2))), h("span", {}, "平均值")),
          h("div", {}, h("b", {}, q.min), h("span", {}, "最小值")),
          h("div", {}, h("b", {}, q.max), h("span", {}, "最大值")))) : null,
      q.values ? (q.values.length ? h("details", { open: q.type === "text" },
        h("summary", {}, `全部 ${q.values.length} 条回答`),
        h("ol", { class: "values" }, q.values.map((v) => h("li", {}, String(v))))) :
        (q.type === "text" ? h("p", { class: "muted" }, "还没有人作答。") : null)) : null,
    );
  }

  async function load(questionId) {
    try {
      if (!Object.keys(sourceByQuestion).length) {
        const detail = await creatorCall("GET", `/api/surveys/${id}`);
        sourceByQuestion = Object.fromEntries(detail.questions.map((q) => [q.questionId, q]));
      }
      const path = questionId ? `/api/surveys/${id}/stats/${questionId}` : `/api/surveys/${id}/stats`;
      const data = await creatorCall("GET", path);
      if (!questionId) allQuestions = data.questions;
      const pick = h("select", { onchange: (e) => load(e.target.value || null) },
        h("option", { value: "" }, "整个问卷"),
        allQuestions.map((q) => h("option", { value: q.questionId, selected: q.questionId === questionId }, `第 ${q.order} 题：${q.title}`)));
      mount(document.getElementById("app"),
        h("div", { class: "card" },
          h("div", { class: "title-row" },
            h("h2", {}, data.title),
            h("span", { class: "spacer" }),
            h("button", { onclick: exportCsv }, "导出 CSV"),
            h("a", { href: `/surveys/${id}` }, "返回管理页")),
          h("div", { class: "row", style: "margin-top:14px;gap:28px" },
            h("div", { class: "figures total", style: "margin:0" },
              h("div", {}, h("b", {}, data.totalResponses), h("span", {}, "份答卷"))),
            h("label", { class: "row", style: "gap:8px;font-weight:400" }, "查看", pick)),
        ),
        data.totalResponses ? data.questions.map(questionStat)
          : h("div", { class: "card" }, h("p", { class: "muted" }, "还没有收到答卷。把填写链接发出去后，统计会在这里自动更新。")),
      );
    } catch (err) {
      mount(document.getElementById("app"), errorBanner(err));
    }
  }
  load(null);
</script>
</body>
</html>
