<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的问卷 - 问卷系统</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main>
  <div class="card">
    <h2>新建问卷</h2>
    <div id="create-msg"></div>
    <form id="create" class="row">
      <input id="title" class="grow" type="text" placeholder="问卷标题" required maxlength="200">
      <input id="desc" class="grow" type="text" placeholder="问卷说明（选填）" maxlength="5000">
      <button class="primary" type="submit">创建并编辑</button>
    </form>
  </div>
  <div class="card">
    <h2>我的问卷</h2>
    <div id="list"></div>
  </div>
</main>
<script src="/static/api.js"></script>
<script>
  requireLogin();
  renderNav();

  async function load() {
    const list = document.getElementById("list");
    const surveys = await creatorCall("GET", "/api/surveys");
    if (!surveys.length) {
      mount(list, h("p", { class: "muted" }, "还没有问卷，先在上面新建一个吧。"));
      return;
    }
    mount(list, h("table", {},
      h("thead", {}, h("tr", {}, ["标题", "状态", "答卷数", "截止时间", "创建时间", ""].map((t) => h("th", {}, t)))),
      h("tbody", {}, surveys.map((s) => h("tr", {},
        h("td", {}, h("a", { href: `/surveys/${s.id}` }, s.title)),
        h("td", {}, statusBadge(s.displayStatus)),
        h("td", {}, s.maxResponses ? `${s.responseCount} / ${s.maxResponses}` : s.responseCount),
        h("td", {}, fmtTime(s.deadline)),
        h("td", {}, fmtTime(s.createdAt)),
        h("td", {}, h("a", { href: `/surveys/${s.id}` }, "管理")),
      ))),
    ));
  }

  document.getElementById("create").onsubmit = async (e) => {
    e.preventDefault();
    try {
      const s = await creatorCall("POST", "/api/surveys", {
        title: document.getElementById("title").value.trim(),
        description: document.getElementById("desc").value.trim(),
      });
      location.href = `/surveys/${s.id}/edit`;
    } catch (err) {
      document.getElementById("create-msg").replaceChildren(errorBanner(err));
    }
  };

  load();
</script>
</body>
</html>
