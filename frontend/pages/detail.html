<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>问卷管理 - 问卷系统</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main>
  <div id="msg"></div>
  <div id="app"></div>
</main>
<script src="/static/api.js"></script>
<script>
  requireLogin();
  renderNav();
  const id = pathParam(1);
  const msg = document.getElementById("msg");

  async function act(method, path, okText) {
    try {
      await creatorCall(method, path);
      flash(msg, h("div", { class: "banner ok" }, okText));
      await load();
    } catch (err) {
      flash(msg, errorBanner(err), 0);
    }
  }

  async function copyAsDraft() {
    try {
      const draft = await creatorCall("POST", `/api/surveys/${id}/copy`);
      location.href = `/surveys/${draft.id}/edit`;
    } catch (err) { flash(msg, errorBanner(err), 0); }
  }

  function render(s) {
    const link = surveyLink(s.slug);
    const st = s.status;
    const copy = () => navigator.clipboard.writeText(link)
      .then(() => flash(msg, h("div", { class: "banner ok" }, "链接已复制")));
    mount(document.getElementById("app"),
      h("div", { class: "card" },
        h("div", { class: "title-row" }, h("h2", {}, s.title), statusBadge(s.displayStatus)),
        s.description ? h("p", { class: "muted" }, s.description) : null,
        h("div", { class: "kv" },
          h("span", { class: "k" }, "填写链接"),
          h("span", {}, st === "draft" ? h("span", { class: "muted" }, "发布后生成") : h("span", { class: "row", style: "gap:10px" },
            h("a", { href: link, target: "_blank" }, link), h("button", { class: "small", onclick: copy }, "复制链接"))),
          h("span", { class: "k" }, "已收答卷"),
          h("span", {}, s.settings.maxResponses ? `${s.responseCount} 份，上限 ${s.settings.maxResponses} 份` : `${s.responseCount} 份`),
          h("span", { class: "k" }, "题目"), h("span", {}, `${s.questionCount} 道`),
          h("span", { class: "k" }, "截止时间"), h("span", {}, s.deadline ? fmtTime(s.deadline) : "不限"),
          h("span", { class: "k" }, "填写规则"), h("span", {},
            h("span", { class: "tag" }, s.settings.requireLogin ? "需要登录" : "无需登录"),
            h("span", { class: "tag" }, s.settings.allowAnonymous ? "匿名" : "记录填写人"),
            h("span", { class: "tag" }, s.settings.allowMultipleSubmit ? "可重复填写" : "每人一次")),
          h("span", { class: "k" }, "版本"), h("span", { class: "muted" }, `第 ${s.version} 版，最近修改于 ${fmtTime(s.updatedAt)}`),
          h("span", { class: "k" }, "创建与发布"), h("span", { class: "muted" },
            `${fmtTime(s.createdAt)} 创建` + (s.publishedAt ? `，${fmtTime(s.publishedAt)} 发布` : "，尚未发布")),
        ),
      ),
      h("div", { class: "card row" },
        h("a", { class: "btn primary", href: `/surveys/${id}/edit` }, st === "draft" ? "编辑题目" : "查看题目"),
        h("button", { onclick: copyAsDraft }, "复制为新草稿"),
        h("a", { class: "btn", href: `/surveys/${id}/preview` }, "预览"),
        h("a", { class: "btn", href: `/surveys/${id}/share` }, st === "draft" ? "发布" : "分享设置"),
        h("a", { class: "btn", href: `/surveys/${id}/stats` }, "查看统计"),
        st === "published" ? h("button", { onclick: () => act("POST", `/api/surveys/${id}/close`, "问卷已关闭") }, "关闭问卷") : null,
        st === "closed" ? h("button", { onclick: () => act("POST", `/api/surveys/${id}/reopen`, "问卷已重新开放") }, "重新开放") : null,
        h("span", { class: "spacer" }),
        h("button", { class: "small", title: "按数据库中的实际答卷重新计数",
          onclick: () => act("POST", `/api/surveys/${id}/recount`, "答卷数已重新计数") }, "重新计数"),
        h("button", {
          class: "danger small",
          onclick: async () => {
            if (!confirm("删除后填写链接立即失效，已收到的答卷仍保留在数据库中。确定删除？")) return;
            await creatorCall("DELETE", `/api/surveys/${id}`);
            location.href = "/";
          },
        }, "删除问卷"),
      ),
      s.questions.some((q) => q.sourceItemId) ? h("div", { class: "card" },
        h("h3", {}, "题目来源"), s.questions.map((q) => h("p", {},
          `第 ${q.order} 题：${q.title} `,
          q.sourceItemId ? h("a", { href: `/questions/${q.sourceItemId}` }, "查看版本与引用")
            : h("span", { class: "muted" }, "尚未保存为独立题目")))) : null,
    );
  }

  async function load() {
    try {
      render(await creatorCall("GET", `/api/surveys/${id}`));
    } catch (err) {
      mount(document.getElementById("app"), errorBanner(err));
    }
  }
  load();
</script>
</body>
</html>
