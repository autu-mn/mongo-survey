<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>发布与分享设置 - 问卷系统</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main>
  <div id="msg"></div>
  <div id="app"></div>
</main>
<script src="/static/api.js"></script>
<script>
  requireLogin();
  renderNav();
  const id = pathParam(1);
  const msg = document.getElementById("msg");

  // datetime-local 使用本地时间，提交时转成带时区的 ISO 字符串
  const toLocalInput = (iso) => {
    if (!iso) return "";
    const d = new Date(iso);
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  };

  function render(survey) {
    const s = survey.settings;
    const f = {
      requireLogin: h("input", { type: "checkbox", checked: s.requireLogin }),
      allowAnonymous: h("input", { type: "checkbox", checked: s.allowAnonymous }),
      allowMultipleSubmit: h("input", { type: "checkbox", checked: s.allowMultipleSubmit }),
      deadline: h("input", { id: "deadline", type: "datetime-local", value: toLocalInput(s.deadline), style: "max-width:260px" }),
      maxResponses: h("input", { id: "max", type: "number", min: 1, value: s.maxResponses ?? "", placeholder: "不限", style: "max-width:160px" }),
      message: h("textarea", {}, s.completion.message),
      redirectUrl: h("input", { type: "url", value: s.completion.redirectUrl ?? "", placeholder: "https://…（选填）" }),
    };
    const hint = h("span", { class: "muted" });
    const sync = () => {
      hint.textContent = !f.allowMultipleSubmit.checked && !f.requireLogin.checked
        ? "不登录就无法识别是不是同一个人，请勾选\"填写前需要登录\"或\"同一人可以重复填写\"。" : "";
      hint.className = hint.textContent ? "error" : "muted";
    };
    f.requireLogin.onchange = f.allowMultipleSubmit.onchange = sync;
    sync();

    const read = () => ({
      requireLogin: f.requireLogin.checked,
      allowAnonymous: f.allowAnonymous.checked,
      allowMultipleSubmit: f.allowMultipleSubmit.checked,
      deadline: f.deadline.value ? new Date(f.deadline.value).toISOString() : null,
      maxResponses: f.maxResponses.value ? Number(f.maxResponses.value) : null,
      completion: { message: f.message.value, redirectUrl: f.redirectUrl.value.trim() || null },
    });

    const saveSettings = async () => {
      await creatorCall("PUT", `/api/surveys/${id}/settings`, read());
    };

    const run = async (fn, okText) => {
      try {
        await fn();
        flash(msg, h("div", { class: "banner ok" }, okText));
        render(await creatorCall("GET", `/api/surveys/${id}`));
      } catch (err) {
        flash(msg, errorBanner(err), 0);
      }
    };

    const link = surveyLink(survey.slug);
    const section = (title, note, ...fields) => h("div", { class: "card fsec" },
      h("div", {}, h("h3", {}, title), h("p", { class: "muted" }, note)),
      h("div", {}, ...fields));
    mount(document.getElementById("app"),
      h("div", { class: "card" },
        h("div", { class: "title-row" }, h("h2", {}, survey.title), statusBadge(survey.displayStatus)),
        h("p", { class: "row", style: "gap:10px;margin:8px 0 0" },
          survey.status === "draft"
            ? h("span", { class: "muted" }, `发布后，问卷可通过 ${link} 填写`)
            : h("a", { href: link, target: "_blank" }, link),
          survey.status === "draft" ? null
            : h("button", { class: "small", onclick: () => navigator.clipboard.writeText(link)
                .then(() => flash(msg, h("div", { class: "banner ok" }, "链接已复制"))) }, "复制链接")),
      ),
      section("谁可以填写", "默认要求登录。不登录就无法识别同一个人，因此关闭登录时必须允许重复填写。",
        h("div", { class: "col" }, h("label", {}, f.requireLogin, " 填写前需要登录")),
        h("div", { class: "col" }, h("label", {}, f.allowAnonymous, " 匿名填写，答卷不记录填写人")),
        h("div", { class: "col" }, h("label", {}, f.allowMultipleSubmit, " 同一人可以重复填写"), hint)),
      section("何时停止收集", "到达截止时间或答卷数达到上限后，链接显示问卷已结束。",
        h("div", { class: "col" }, h("label", { for: "deadline" }, "截止时间"), f.deadline),
        h("div", { class: "col" }, h("label", { for: "max" }, "答卷数上限"), f.maxResponses)),
      section("提交之后", "填写人提交后看到的提示语，以及可选的跳转链接。",
        h("div", { class: "col" }, h("label", {}, "提示语"), f.message),
        h("div", { class: "col" }, h("label", {}, "跳转链接"), f.redirectUrl)),
      h("div", { class: "card row add-card" },
        survey.status === "draft"
          ? h("button", { class: "primary", onclick: () => run(async () => {
              await saveSettings();
              await creatorCall("POST", `/api/surveys/${id}/publish`);
            }, "问卷已发布，可以把链接发出去了") }, "保存并发布")
          : null,
        h("button", { class: survey.status === "draft" ? "" : "primary", onclick: () => run(saveSettings, "设置已保存") }, "保存设置"),
        h("span", { class: "spacer" }),
        h("a", { href: `/surveys/${id}` }, "返回管理页"),
      ),
    );
  }

  creatorCall("GET", `/api/surveys/${id}`).then(render).catch((err) => mount(document.getElementById("app"), errorBanner(err)));
</script>
</body>
</html>
